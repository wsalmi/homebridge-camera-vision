<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @keyframes m3-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes m3-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      .m3-sensor-ring {
        transform-origin: 256px 256px;
        animation: m3-spin 14s linear infinite;
      }
      .m3-iris-group {
        transform-origin: 256px 256px;
        animation: m3-pulse 3.5s ease-in-out infinite;
      }
    </style>
    <linearGradient id="m3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d46"/>
      <stop offset="100%" stop-color="#006a60"/>
    </linearGradient>
    <linearGradient id="m3-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70f7e7"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
    <linearGradient id="m3-iris" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4edad0"/>
      <stop offset="100%" stop-color="#008779"/>
    </linearGradient>
    <radialGradient id="m3-core" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#003833"/>
      <stop offset="80%" stop-color="#001a18"/>
      <stop offset="100%" stop-color="#001110"/>
    </radialGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#m3-bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#70f7e7" stroke-width="3" stroke-opacity="0.3"/>

  <circle class="m3-sensor-ring" cx="256" cy="256" r="160" fill="none" stroke="url(#m3-ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="720 40" stroke-opacity="0.85"/>

  <g class="m3-iris-group">
    <g transform="rotate(15 256 256)">
      <path d="M256,128 A128,128 0 0,1 366.8,192 L256,256 Z" fill="url(#m3-iris)" opacity="0.95"/>
      <path d="M366.8,192 A128,128 0 0,1 366.8,320 L256,256 Z" fill="url(#m3-iris)" opacity="0.9"/>
      <path d="M366.8,320 A128,128 0 0,1 256,384 L256,256 Z" fill="url(#m3-iris)" opacity="0.85"/>
      <path d="M256,384 A128,128 0 0,1 145.2,320 L256,256 Z" fill="url(#m3-iris)" opacity="0.8"/>
      <path d="M145.2,320 A128,128 0 0,1 145.2,192 L256,256 Z" fill="url(#m3-iris)" opacity="0.85"/>
      <path d="M145.2,192 A128,128 0 0,1 256,128 L256,256 Z" fill="url(#m3-iris)" opacity="0.9"/>
    </g>
    <circle cx="256" cy="256" r="88" fill="url(#m3-core)" stroke="#70f7e7" stroke-width="4" stroke-opacity="0.5"/>
    <circle cx="256" cy="256" r="36" fill="#00a896"/>
    <circle cx="256" cy="256" r="20" fill="#70f7e7"/>
    <circle cx="236" cy="236" r="14" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="280" cy="280" rx="6" ry="3" transform="rotate(-45 280 280)" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>